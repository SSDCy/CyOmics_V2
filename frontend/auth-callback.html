<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <script src="/auth-callback.js"></script>

  <link rel="stylesheet" href="/style.css">

<body>

    <nav class="public-nav" aria-label="Cy_Omics_v2.0">
      <a href="/#/" class="logo" id="callback-brand" aria-label="Cy_Omics_v2.0 首页">
        <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>

        <div class="auth-foot"><a href="/#/" id="callback-home">返回首页</a></div>
